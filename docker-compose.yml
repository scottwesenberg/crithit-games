services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crithit
      POSTGRES_PASSWORD: crithit
      POSTGRES_DB: crithit
    ports:
      - "5432:5432"
    volumes:
      - crithit-db-data:/var/lib/postgresql/data

volumes:
  crithit-db-data:
